<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Centolo – Erinnerungen</title><meta name="theme-color" content="#1f4e5f">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#1f4e5f;--rot:#b3261e;--bg:#f6f1ea;--tx:#22292b;--mu:#62706f;--ln:#ddd5ca}
@media (prefers-color-scheme:dark){:root{--bg:#161d1f;--tx:#eee8e0;--mu:#a9b6b4;--ln:#2e3b3d}.card,input,select,textarea,.sheet{background:#202b2d!important;color:var(--tx)!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--c);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;line-height:1.2}header small{display:block;font-weight:400;opacity:.85;font-size:13px}
main{padding:12px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:transparent;color:var(--mu);padding:12px 4px;font-size:16px;min-height:58px}nav button.on{color:var(--c);font-weight:700;border-top:3px solid var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:#fff;width:100%;min-height:48px}
textarea{min-height:90px}label{display:block;font-size:14px;color:var(--mu);margin:12px 0 3px}
.btn{background:var(--c);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;min-height:50px}.btn.alt{background:#0000;color:var(--c);border:1px solid var(--c)}.btn.s{padding:8px 12px;min-height:42px;font-size:16px}.btn.big{width:100%;font-size:20px;min-height:62px}.btn.rot{background:var(--rot)}.btn.grau{background:#0000;color:var(--mu);border:1px solid var(--ln)}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0}
.card b{font-size:18px}.mu{color:var(--mu);font-size:15px}.tag{display:inline-block;background:#1f4e5f18;color:var(--c);border-radius:6px;padding:1px 8px;font-size:13px;margin:4px 6px 0 0}
.sum{background:#1f4e5f10;border-left:4px solid var(--c);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:16px}
#ov{position:fixed;inset:0;background:#0007;z-index:10;display:none;overflow:auto}.sheet{background:var(--bg);margin:0 auto;max-width:760px;min-height:100%;padding:16px 16px 60px}
#toast{position:fixed;left:16px;right:16px;bottom:78px;background:#222;color:#fff;border-radius:10px;padding:12px 14px;z-index:20;display:none}#toast.err{background:#a02020}
.zeit{font-size:56px;text-align:center;font-variant-numeric:tabular-nums;margin:18px 0 6px}
.pegel{height:14px;background:var(--ln);border-radius:7px;overflow:hidden;margin:8px 0 18px}.pegel i{display:block;height:100%;width:0;background:var(--rot);transition:width .1s}
.foto{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.foto img{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none}
audio{width:100%;margin:6px 0}
</style></head><body>
<header><h1>O Centolo – Erinnerungen<small id="hs"></small></h1></header>
<main id="m"></main><nav id="nv"></nav><div id="ov"></div><div id="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});var had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload();had=true;});});</script>
</body></html>
